name: CI

# 四档：
#   push / PR        → 必跑：Python 工具链全量回归 + Kotlin 全量单测
#   push 到主分支    → 加跑：76 张页面截图（产物是人要去看的图，不压在每个 PR 上）
#   workflow_dispatch → 额外跑 Android 与 Windows 桌面打包（慢，按需）
#
# 为什么 Android 与桌面打包不放进必跑：两者都要拉 SDK / WiX，单次十几分钟，
# 而它们的产物每天并不变。"提交即验"要的是快信号，产物在发版前手动触发即可。
# 截图为什么不进 PR：它只证明"图还能渲染出来"，看的是产物而不是结果码，
# 而 PR 的必跑里已经有 DarkSurfaceTest 那三页的像素护栏。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4096M
    -Dfile.encoding=UTF-8

jobs:
  # ---------------------------------------------------------------- 工具链
  # 制包工具链与制包 Skill 的全部回归。纯 Python，秒级到分钟级。
  toolchain:
    name: 制包工具链回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 清单只维护一份（tools/verify/run_all.py），本地与 CI 跑的是同一套。
      - name: 全量回归（坏包 / 扩展包 / 补丁 / Skill 自检 / 可复现构建 / 样本包校验）
        run: python tools/verify/run_all.py --quiet

  # ---------------------------------------------------------------- Kotlin
  jvm-tests:
    name: 共享层单测（含架构验收）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # shared 模块带 androidTarget：即便只跑 :shared:jvmTest，AGP 也会在配置阶段
      # 要求能定位 compileSdk，因此必须先有 Android SDK。
      - name: 准备 Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || \
              echo "::warning::compileSdk 37 未能预装，交给 AGP 自动下载"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: 全量单测
        run: ./gradlew :shared:jvmTest --console=plain --stacktrace

      - name: 汇总用例数
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = 0
          for path in glob.glob("shared/build/test-results/jvmTest/*.xml"):
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
          print(f"tests={total} failures={failures} errors={errors}")
          with open("shared/build/test-summary.txt", "w", encoding="utf-8") as fh:
              fh.write(f"tests={total} failures={failures} errors={errors}\n")
          PY

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-results
          path: |
            shared/build/reports/tests/jvmTest
            shared/build/test-results/jvmTest
            shared/build/test-summary.txt
          if-no-files-found: warn

  # ------------------------------------------------------------------ 截图
  # 76 张页面图的离屏渲染，外加"深色页某块还是浅色"的像素断言。
  # 本地对应的命令是同一条：`KT_SHOTS=1 ./gradlew :shared:jvmTest --tests "*ScreenshotTest*"`。
  screenshots:
    name: 页面截图（离屏渲染）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    env:
      KT_SHOTS: "1"
      # 卡死张数是有原因的：`--tests` 过滤写错、KT_SHOTS 没生效、测试结果命中缓存，
      # 这三种情况都会让"一张图都没渲染"的 job 变成绿的。用例总数会骗人，文件数不会。
      # 新增或删掉截图时同步改这里（docs 里也写着这个数字）。
      EXPECTED_SHOTS: "76"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 与 jvm-tests 同理：shared 带 androidTarget，配置阶段就要能定位 compileSdk。
      - name: 准备 Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || \
              echo "::warning::compileSdk 37 未能预装，交给 AGP 自动下载"
          fi

      # 两样东西是渲染的前提：skiko 的 linux 原生库会 dlopen libGL.so.1；
      # 界面全是中文，没有 CJK 字体拍出来是一堆豆腐块 —— 那样的产物等于没拍。
      - name: 装渲染依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libfontconfig1 fonts-noto-cjk

      - uses: gradle/actions/setup-gradle@v4

      # --rerun-tasks --no-build-cache 不是保守，是必需：setup-gradle 会恢复上一次的
      # 构建缓存，jvmTest 一旦 FROM-CACHE 就直接"通过"，图片一张都不会写出来。
      - name: 渲染截图
        run: >
          ./gradlew :shared:jvmTest --tests "*ScreenshotTest*"
          --rerun-tasks --no-build-cache --console=plain

      - name: 核对张数
        run: |
          count=$(find shared/build/ui-shots -name '*.png' | wc -l | tr -d ' ')
          echo "渲染 $count 张（期望 $EXPECTED_SHOTS）" >> "$GITHUB_STEP_SUMMARY"
          find shared/build/ui-shots -name '*.png' -printf '%f\n' | sort | tr '\n' ' ' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            echo "::error::一张图都没渲染 —— KT_SHOTS 没进测试进程，或 --tests 匹配不到用例"
            exit 1
          fi
          if [ "$count" -ne "$EXPECTED_SHOTS" ]; then
            echo "::error::渲染了 $count 张，期望 $EXPECTED_SHOTS 张：要么新增/删掉了截图（改 EXPECTED_SHOTS 与 docs），要么有用例被静默跳过"
            exit 1
          fi

      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: shared/build/ui-shots
          if-no-files-found: error

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-test-results
          path: |
            shared/build/reports/tests/jvmTest
            shared/build/test-results/jvmTest
          if-no-files-found: warn

  # ---------------------------------------------------------------- Android
  android:
    name: Android 打包
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || true
          fi

      - uses: gradle/actions/setup-gradle@v4

      # release 目前没有签名配置，产物是 -unsigned；这里只验证它能打出来。
      - name: 打 debug 与 release
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --console=plain

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- 桌面端
  desktop:
    name: Windows 桌面打包
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 免安装目录
        run: ./gradlew :desktopApp:createDistributable --console=plain

      # WiX 由 compose desktop 的任务自己准备（unzipWix），不需要预装。
      - name: MSI 安装包
        run: ./gradlew :desktopApp:packageMsi --console=plain

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/app/**
          if-no-files-found: error

      # jpackage 的真实报错只写在它自己的 err 日志里：Gradle 那边永远只说
      # "External tool execution failed / Exit code: 1"。不传上来就只能猜。
      - name: 上传 jpackage 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jpackage-logs
          path: |
            desktopApp/build/compose/logs
            desktopApp/build/compose/tmp/packageMsi.args.txt
          if-no-files-found: warn
